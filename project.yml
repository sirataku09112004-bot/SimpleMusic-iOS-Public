name: SimpleMusic
options:
  bundleIdPrefix: com.sirataku
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    "ARCHS[sdk=iphonesimulator*]": arm64
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  SimpleMusic:
    type: application
    platform: iOS
    sources:
      - path: SimpleMusic
      - path: Shared
    dependencies:
      - target: SimpleMusicControls
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirataku.simplemusic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "25"
        SWIFT_OBJC_BRIDGING_HEADER: SimpleMusic/SimpleMusic-Bridging-Header.h
        HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/Vendor/include', '$(SRCROOT)/Vendor/include/opus']
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/Vendor/lib/$(PLATFORM_NAME)']
        OTHER_LDFLAGS: ['$(inherited)', '-lSimpleOpus']
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SimpleMusic/Info.plist
      properties:
        CFBundleDisplayName: SimpleMusic
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.sirataku.simplemusic.actions
            CFBundleURLSchemes: [simplemusic]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIDesignRequiresCompatibility: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  SimpleMusicControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Controls
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirataku.simplemusic.controls
        PRODUCT_NAME: SimpleMusicControls
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ['$(inherited)', CONTROL_EXTENSION]
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "25"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: SimpleMusic Controls
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SimpleMusicTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: SimpleMusic
  SimpleMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TestsUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SimpleMusic
    dependencies:
      - target: SimpleMusic
schemes:
  SimpleMusic:
    build:
      targets:
        SimpleMusic: all
    test:
      targets:
        - SimpleMusicTests
        - SimpleMusicUITests
